version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: accqudo_prod_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=500
    volumes:
      - mysql_prod_data:/var/lib/mysql
    networks:
      - accqudo_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: accqudo_prod_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    networks:
      - accqudo_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: accqudo_prod_api
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env.production
    networks:
      - accqudo_network
    expose:
      - "8000"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
    container_name: accqudo_prod_web
    restart: always
    depends_on:
      - api
    networks:
      - accqudo_network
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: accqudo_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api
      - web
    networks:
      - accqudo_network

volumes:
  mysql_prod_data:
  redis_prod_data:

networks:
  accqudo_network:
    driver: bridge